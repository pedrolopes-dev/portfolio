<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Escuro Radial Profundo -->
    <radialGradient id="bg-dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#021420" />
      <stop offset="60%" stop-color="#010a12" />
      <stop offset="100%" stop-color="#000307" />
    </radialGradient>

    <!-- Gradiente Interno Azul/Ciano Elétrico do P -->
    <linearGradient id="p-fill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" />
      <stop offset="40%" stop-color="#00bfff" />
      <stop offset="80%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#0022a8" />
    </linearGradient>

    <!-- Brilho Neon Ciano Extremo (Pixel Glow) -->
    <filter id="pixel-neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo com Cantos Suavemente Arredondados -->
  <rect width="512" height="512" rx="96" fill="url(#bg-dark)" />

  <!-- PARTÍCULAS / PIXELS FLUTUANTES AO REDOR DO P -->
  <g fill="#00ffff" opacity="0.8">
    <rect x="180" y="90" width="8" height="8" />
    <rect x="320" y="110" width="10" height="10" />
    <rect x="350" y="130" width="6" height="6" />
    <rect x="120" y="150" width="8" height="8" />
    <rect x="135" y="220" width="10" height="10" opacity="0.6" />
    <rect x="380" y="220" width="8" height="8" />
    <rect x="110" y="300" width="6" height="6" />
    <rect x="385" y="255" width="10" height="10" />
    <rect x="130" y="385" width="8" height="8" />
    <rect x="250" y="330" width="6" height="6" />
    <rect x="190" y="440" width="10" height="10" />
  </g>

  <!-- ESTRUTURA PRINCIPAL DO "P" EM PIXEL ART COM BRILHO NEON -->
  <g filter="url(#pixel-neon-glow)">
    
    <!-- 1. Camada Externa de Borda Neon Ciano (Outer Neon Stroke) -->
    <path d="
      M 140 120 
      H 310 
      V 150 
      H 340 
      V 180 
      H 370 
      V 270 
      H 340 
      V 300 
      H 310 
      V 330 
      H 220 
      V 420 
      H 140 
      Z" 
      fill="none" 
      stroke="#00ffff" 
      stroke-width="16" 
      stroke-linejoin="miter" />

    <!-- 2. Preenchimento Gradiente com Formato Pixelado do P -->
    <path d="
      M 148 128 
      H 302 
      V 158 
      H 332 
      V 188 
      H 362 
      V 262 
      H 332 
      V 292 
      H 302 
      V 322 
      H 228 
      V 412 
      H 148 
      Z" 
      fill="url(#p-fill-grad)" />

    <!-- 3. O Buraco do P (Inner Pixel Hole) -->
    <!-- Contorno Neon do Buraco -->
    <path d="
      M 210 180 
      H 270 
      V 200 
      H 290 
      V 230 
      H 270 
      V 250 
      H 210 
      Z" 
      fill="#010a12" 
      stroke="#00ffff" 
      stroke-width="10" 
      stroke-linejoin="miter" />

    <!-- 4. Linha Interna de Destaque Neon (Inner Cyan Highlight Contour) -->
    <path d="
      M 164 144 
      H 286 
      V 174 
      H 316 
      V 204 
      H 346 
      V 246 
      H 316 
      V 276 
      H 286 
      V 306 
      H 204 
      V 396 
      H 164 
      Z" 
      fill="none" 
      stroke="#00ffff" 
      stroke-width="5" 
      opacity="0.9" />

  </g>
</svg>
